<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Seguros - Exame Prático</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }

        h1 {
            color: #333;
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #0078d4;
            padding-bottom: 10px;
        }

        .stat-card {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
        }

        .label {
            font-weight: bold;
            color: #555;
        }

        .value {
            color: #0078d4;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }

        .json-output {
            background: #272822;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 4px;
            font-size: 0.85rem;
            overflow-x: auto;
            margin-top: 20px;
        }

        .error {
            color: #d9534f;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Relatório de Médias de Seguros</h1>

        <div id="loading" style="text-align: center;">Carregando dados...</div>

        <div id="content" style="display: none;">
            <div class="stat-card">
                <span class="label">Média Prêmio Risco:</span>
                <span class="value" id="avgRisco">R$ 0,00</span>
            </div>
            <div class="stat-card">
                <span class="label">Média Prêmio Puro:</span>
                <span class="value" id="avgPuro">R$ 0,00</span>
            </div>
            <div class="stat-card">
                <span class="label">Média Prêmio Comercial:</span>
                <span class="value" id="avgComercial">R$ 0,00</span>
            </div>

            <h3>Saída JSON (Requisito 2.1):</h3>
            <pre class="json-output" id="jsonRaw"></pre>
        </div>

        <div id="errorMessage" class="error" style="display: none;">
            Erro ao conectar com a API. Verifique se o backend está rodando.
        </div>
    </div>

    <script>
    async function fetchRelatorio() {
        const url = '/api/seguro/relatorio';

        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error('Erro na requisição');

            const data = await response.json();

            document.getElementById('avgRisco').innerText = `R$ ${data.mediaPremioRisco.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
            document.getElementById('avgPuro').innerText = `R$ ${data.mediaPremioPuro.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
            document.getElementById('avgComercial').innerText = `R$ ${data.mediaPremioComercial.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;

            document.getElementById('jsonRaw').textContent = JSON.stringify(data, null, 2);

            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';
        } catch (error) {
            console.error(error);
            document.getElementById('loading').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'block';
        }
    }

    fetchRelatorio();
    </script>

</body>
</html>
